[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithms"
version = "0.1.0"
description = "Python implementations of classic algorithms, each with tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["algorithms*"]

[tool.pytest.ini_options]
testpaths = ["tests", "algorithms"]
pythonpath = ["."]
addopts = "-q --doctest-modules"
